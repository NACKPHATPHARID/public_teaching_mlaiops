# ITCS355 Lab 4: continuous deployment to staging.
#
# Runs only on main, only after CI is green, on the exact commit CI tested.
# Credentials come from OIDC federation (workload identity), no stored keys.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  CLOUD_PROVIDER: gcp
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.REGION }}
  BLOB_URI: ${{ vars.BLOB_URI }}
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db
  MODEL_REGISTRY_NAME: ${{ vars.MODEL_REGISTRY_NAME }}
  IDENTITY_REF: ${{ vars.IDENTITY_REF }}
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
  STAGING_MODEL_VERSION: ${{ vars.STAGING_MODEL_VERSION }}
  STAGING_ENDPOINT: itcs355-serve-staging

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # Check out the commit CI tested, not whatever main is now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev --quiet

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Build serving image
        run: docker build --platform linux/amd64 -f service/Dockerfile.serve -t itcs355-serve:${IMAGE_TAG} .

      - name: Deploy to staging
        env:
          SERVE_IMAGE: itcs355-serve:${{ github.event.workflow_run.head_sha }}
          SERVE_MIN_INSTANCES: "0"
        run: |
          python - <<'PY'
          import os
          from src import config
          from cloudlayer.factory import get_adapter
          a = get_adapter(config.load())
          v, ep = os.environ["STAGING_MODEL_VERSION"], os.environ["STAGING_ENDPOINT"]
          # deploy() pushes the SHA-tagged image and returns a digest-pinned reference.
          print("deployed", a.deploy(v, ep, "1/1Gi"))
          # An existing service gets the new revision with 0% traffic. Move staging onto it.
          print(a.set_traffic(ep, {f"model-v{v}": 100}))
          PY

      - name: Smoke test
        run: |
          python - <<'PY'
          import os
          from src import config
          from cloudlayer.factory import get_adapter
          a = get_adapter(config.load())
          ep, v = os.environ["STAGING_ENDPOINT"], os.environ["STAGING_MODEL_VERSION"]
          payloads = {
              "healthy": {"temp_c": 66.0, "vibration_mm_s": 1.4, "pressure_kpa": 330.0,
                          "hours_since_service": 50.0, "load_pct": 30.0, "ambient_humidity": 50.0},
              "typical": {"temp_c": 78.4, "vibration_mm_s": 3.1, "pressure_kpa": 315.2,
                          "hours_since_service": 4200.0, "load_pct": 68.0, "ambient_humidity": 55.0},
              "worn": {"temp_c": 82.0, "vibration_mm_s": 4.0, "pressure_kpa": 310.0,
                       "hours_since_service": 8500.0, "load_pct": 75.0, "ambient_humidity": 60.0},
          }
          out = {}
          for name, p in payloads.items():
              r = a.invoke(ep, p)
              assert 0.0 <= r["probability"] <= 1.0, (name, r)
              assert str(r["model_version"]) == v, (name, r)
              out[name] = r["probability"]
              print(name, r)
          assert out["healthy"] < 0.5, f"healthy machine flagged: {out}"
          assert out["healthy"] <= out["worn"], f"risk fell with wear: {out}"
          PY
